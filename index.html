<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dt-Mobile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section class="sdlms-container">
            <div class="info-bar">
            <div class="session-info">
                <header class="session-title">
                    <h2 class="title ">Live session</h2>
                </header>
                <div class="session-details">
                    <p class="session-content">Exponents</p>
                    <span class="date">sat 12 Feb 2022</span>
                    <span class="time">8: 00 pm</span>
                    <span class="text session-text">Let's learn how rumours diffuse across networks</span>
                </div>
            </div>
            <div class="session-info">
                <header class="session-title">
                    <h2 class="title ">Live session</h2>
                </header>
                <div class="session-details">
                    <p class="session-content">Exponents</p>
                    <span class="date">sat 12 Feb 2022</span>
                    <span class="time">8: 00 pm</span>
                    <span class="text session-text">Let's learn how rumours diffuse across networks</span>
                </div>
            </div>
        </div>
            <div class="sdlms-input">
                <div class="tabs">
                    <button class="active">ThreadBuilder</button>
                    <button>Eaglebuilder</button>
                    <button>Spreadsheet</button>
                    <button>character counter</button>
                    <button>character 1</button>
                    <button>character 2</button>
                </div>
                <div class="threadbuilder">
                    <div class="threads">
                        <header class="thread-header">
                            <h3>Thread A</h3>
                        </header>
                    </div>
                    <div class="sub-thread mar-b-1">
                    <div class="subthread-container">
                        <header class="subthread-header">
                            <h4>subthread 1</h4>
                            <button onclick="onDelete('1')" class="btn-del delete">Delete</button>
                        </header>
                        <textarea class="subthread-content" placeholder="Enter Text Here"></textarea>
                    </div>
                    </div>
                    <div class="options mar-b-1">
                        <button  class="btn-sm interpretBtn">Interpret</button>
                        <button class="btn-sm">Rigor</button>
                        <button class="btn-sm subthreadBtn">+ Sub thread</button>
                    </div>
                    <div class="summary-thread mar-b-1">
                        <header class="summary-header">
                            <h4>summary for thread A</h4>
                        </header>
                        <textarea class="summary-content" placeholder="Enter Text Here"></textarea>
                    </div>
                    <div class="thread-end">
                        <div>
                            <p class="text mar-lr-1">thread Credit</p>
                            <button class="btn-round">+</button>
                            <span>Srivalli</span>
                        </div>
                        <select class="drop-down" value="speakers emotion" >
                            <option name="" id="" >Select category</option>
                            <option name="" id="">option</option>
                            <option name="" id="">options</option>
                        </select>
                    </div>
                    <button class="btn-sm fl-r">+ Thread</button>
                    <div class="clearfix"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="/main.js"></script>
</body>
</html>
